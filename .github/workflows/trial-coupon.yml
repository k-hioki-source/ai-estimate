name: Trial coupon validation
on:
  pull_request:
    paths:
      - '**.ts'
      - '**.tsx'
      - '**.mjs'
      - '**.mts'
      - 'docs/sql/**'
      - 'scripts/**'
      - '.github/workflows/trial-coupon.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ci-placeholder-not-a-real-key
      RESEND_API_KEY: ci-placeholder-not-a-real-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-not-a-real-key
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      NEXT_PUBLIC_CSWORKS_TRIAL_COUPON: 'true'
      NEXT_PUBLIC_CSWORKS_FORMAL_QUOTES: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test scripts/trial-coupon.test.mjs
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/trial-coupon-ui-smoke.mjs

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: coupon_ci_password
          POSTGRES_DB: coupon_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: coupon_ci_password
      PGDATABASE: coupon_ci
    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -f scripts/trial-coupon-fixture.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261026140000_formal_quote_items.sql
      - run: psql -v ON_ERROR_STOP=1 -f docs/sql/first-order-trial-coupon.sql
      - run: psql -v ON_ERROR_STOP=1 -f scripts/trial-coupon.test.sql
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/trial-coupon-concurrency.mjs
